# Render.com blueprint: New + > Blueprint > pick your GitHub repo.
services:
  - type: web
    name: kwihh-project
    runtime: node
    plan: free
    buildCommand: echo "no build step - zero dependencies"
    startCommand: node server/index.js
    healthCheckPath: /
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: TRUST_PROXY, value: "1" }
      - { key: ADMIN_USERNAME, value: admin }
      - { key: ADMIN_EMAIL, value: admin@example.com }
      - { key: ADMIN_PASSWORD, sync: false }   # you type this in the Render dashboard
      - { key: DEMO_PASSWORD, sync: false }
      # Paid plans only: attach a disk at /var/data and set DATA_DIR=/var/data so data survives redeploys.
